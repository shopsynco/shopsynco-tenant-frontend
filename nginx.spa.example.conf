# Example: nginx site for a Vite/React SPA (e.g. stagingtenant.shopsynco.com).
# Without this, GET /plans or /Plans returns 404 on refresh because no file exists.
#
# Include something like:
#
#   location / {
#     root   /var/www/tenant-app/dist;
#     try_files $uri $uri/ /index.html;
#   }

server {
    listen 443 ssl;
    server_name stagingtenant.shopsynco.com;

    root /var/www/tenant-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
